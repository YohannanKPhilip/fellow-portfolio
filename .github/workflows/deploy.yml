name: Deploy to GitHub Pages

# Every push to main is checked, built and published.
# Sheet edits don't need a deploy: the site reads the sheet when it loads.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  build:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Set these under Settings > Secrets and variables > Actions > Variables.
          # VITE_DATA_SOURCE is "sheet" unless set to "supabase", so the live site keeps reading the sheet.
          # The publishable key is meant to be public, so it is a Variable, not a Secret.
          VITE_DATA_SOURCE: ${{ vars.VITE_DATA_SOURCE }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
          VITE_SHEET_ID: ${{ vars.VITE_SHEET_ID }}
          VITE_DEFAULT_FELLOW: ${{ vars.VITE_DEFAULT_FELLOW || 'yohannan' }}
          VITE_BASE: ${{ vars.VITE_BASE || '/' }}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
